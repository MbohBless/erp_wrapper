# Everything that differs between one client's deployment and the next.
#
#   ./scripts/provision.py clients/example.yml
#
# Copy this per client, commit it (there are no secrets in here — see below),
# and it becomes the record of what that deployment is. Provisioning is
# idempotent, so re-running after a failure resumes rather than restarts.
#
# FOR A NEW DEPLOYMENT ONLY. Provisioning rewrites .env, rebuilds the
# containers and reissues the ERPNext API credentials — on an instance a client
# is using, that stops them working mid-sentence. It refuses to run against a
# site that already holds sales invoices, and against a directory already
# provisioned as a different site.
#
# A second client gets its own checkout and its own directory. Two deployments
# do not share a working tree: there is one .env, and it describes one of them.
#
# NO PASSWORDS OR KEYS LIVE IN THIS FILE. Provisioning generates them, writes
# them to .env with mode 600, and prints them once. A config file with
# credentials in it is a config file that ends up in a repository.

site:
  # The domain the app is served on. Used for CORS, Caddy and the health check
  # the watchdog polls.
  domain: app.example.com
  # ERPNext's internal site name. Never user-visible; must be a valid hostname.
  erpnext_site: example.local

company:
  # Prints on invoices. This is ERPNext business data, not the product name —
  # see `brand` below for that.
  name: Example Medical Supplies Sarl

  # READ THIS ONE. ERPNext suffixes the abbreviation onto every account,
  # warehouse and cost-centre name it creates — roughly 1,400 of them — and the
  # field is `set_only_once`. It cannot be changed afterwards; the only fix is
  # to rebuild the site from scratch.
  #
  # ERPNext derives it from the company name if you let it ("Quality BioMedicals
  # Sarl" gives QBS, "Quality Biomedicals" gives QB). Provisioning refuses to
  # run without it, deliberately, so the decision is made here and reviewed
  # rather than tabbed past in a wizard.
  abbrev: EMS

  country: Cameroon
  timezone: Africa/Douala
  currency: XAF

  # Must be EXACTLY a chart ERPNext ships for the country — it names a file, and
  # an unrecognised value does not fail loudly: the company is created with no
  # accounts at all. Plain "SYSCOHADA" is the obvious guess and is not one of
  # them. For Cameroon ERPNext offers:
  #   Syscohada - Plan Comptable             <- what the live deployment runs
  #   Syscohada - Plan Comptable avec code
  #   Standard
  #   Standard with Numbers
  # The two Syscohada variants carry the account number differently — the plain
  # one bakes it into the name ("4111-Clients", account_number empty), "avec
  # code" splits them ("Clients", account_number "4111"). Both give an OHADA
  # chart; anything reading accounts by number handles either. Not changeable
  # once anything is posted.
  chart_of_accounts: Syscohada - Plan Comptable

  # Postings outside an active fiscal year are refused, and a fresh site has
  # only the year created here — which is why opening balances have to post on
  # the cutover date rather than their original one.
  fiscal_year_start: "2026-01-01"
  fiscal_year_end: "2026-12-31"

# The ERPNext desk Administrator. Rarely used once the app is running; keep the
# password somewhere safe anyway, because a site rebuild is the alternative.
erpnext_admin:
  email: admin@example.com
  full_name: Administrator

# The account the *application* authenticates to ERPNext as.
#
# Deliberately not Administrator and never a person's login. Whoever owns this
# key owns every document the app creates in ERPNext's audit trail, and
# disabling that human — or trimming their roles — stops the integration dead.
integration_user:
  email: equimed-integration@example.com
  full_name: EquiMed Integration
#
# ERPNext's "<area> Manager" roles do NOT imply the matching "<area> User"
# roles — permissions are granted per role, and the *User* ones carry rights the
# Manager ones simply do not have. With Managers alone, `Warehouse` is not even
# readable, so every warehouse picker, the Inventory page and stock levels
# return 403 the moment the app is used. Each line below is load-bearing:
#
#   Item Manager     Item, Warehouse, Batch, Serial No     (write)
#   Sales User       Customer                              (write)
#   Stock User       Stock Entry, Bin/Warehouse            (read+write)
#   Accounts User    Sales/Purchase Invoice, Payment Entry (write)
#   Purchase User    Warehouse                             (read)
#   Maintenance User Maintenance Visit                     (write)
  roles:
    - System Manager
    - Accounts Manager
    - Accounts User
    - Stock Manager
    - Stock User
    - Sales Manager
    - Sales User
    - Purchase Manager
    - Purchase User
    - Item Manager
    - Maintenance User

# The first application user. Everyone else is created from Settings → Users.
app_admin:
  email: admin@example.com
  full_name: Administrator

# The product's identity for this client. White-labelled, so this is what the
# customer sees; the ERPNext Company above is what their invoices say.
brand:
  name: EquiMed
  short_name: EquiMed
  tagline: Distribution Suite

# Roles this workspace does not hand out. The role keeps its permissions and its
# tests — retiring it only means nobody can be assigned it — so re-enabling one
# is an edit here and a backend restart.
#
# Administrator can never be retired.
disabled_roles: []
# disabled_roles: [Sales]     # e.g. a workspace whose accountant raises invoices

# Master data the business is organised around. Created as *leaf* nodes:
# ERPNext refuses a group node on a transaction, so a value created as a group
# looks selectable in every picker and fails at save.
taxonomy:
  customer_groups:
    - Hospital
    - Health Center
    - Central Labs
    - NGOs
    - Individual
    - Sub Distributor

  # The dashboard groups revenue by these, and every product must belong to one.
  # Two is usually right for a distributor: the devices, and what feeds them.
  item_groups:
    - Consumable
    - Equipment

  territories:
    - Cameroon

# Where stock lives. A distributor generally wants one: devices arrive finished
# and leave finished, and extra warehouses only give people ways to lose track
# of the same box. ERPNext creates several by default; the ones not listed here
# are disabled, never deleted, because stock ledger entries reference them
# forever.
warehouse: Finished Goods

# Optional. Slack or Discord webhook the watchdog posts to when the service
# stops answering. Left empty, the watchdog runs and stays silent.
alert_webhook_url: ""
